<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2711%27%20r%3D%275%27%20fill%3D%27%23b6bcc7%27%2F%3E%3Crect%20x%3D%2747.5%27%20y%3D%2714%27%20width%3D%275%27%20height%3D%2711%27%20rx%3D%272.5%27%20fill%3D%27%23aab0bc%27%2F%3E%3Crect%20x%3D%278%27%20y%3D%2745%27%20width%3D%278%27%20height%3D%2722%27%20rx%3D%274%27%20fill%3D%27%23aab0bc%27%2F%3E%3Crect%20x%3D%2784%27%20y%3D%2745%27%20width%3D%278%27%20height%3D%2722%27%20rx%3D%274%27%20fill%3D%27%23aab0bc%27%2F%3E%3Crect%20x%3D%2713%27%20y%3D%2723%27%20width%3D%2774%27%20height%3D%2762%27%20rx%3D%2717%27%20fill%3D%27%23cdd2db%27%20stroke%3D%27%239aa1ae%27%20stroke-width%3D%272%27%2F%3E%3Crect%20x%3D%2723%27%20y%3D%2734%27%20width%3D%2754%27%20height%3D%2740%27%20rx%3D%2711%27%20fill%3D%27%233a404c%27%2F%3E%3Cellipse%20cx%3D%2738%27%20cy%3D%2750%27%20rx%3D%275%27%20ry%3D%276%27%20fill%3D%27%23eef1f5%27%2F%3E%3Cellipse%20cx%3D%2762%27%20cy%3D%2750%27%20rx%3D%275%27%20ry%3D%276%27%20fill%3D%27%23eef1f5%27%2F%3E%3Crect%20x%3D%2740%27%20y%3D%2763%27%20width%3D%2720%27%20height%3D%274%27%20rx%3D%272%27%20fill%3D%27%23eef1f5%27%2F%3E%3C%2Fsvg%3E">
<title>Agent Queue</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#252a34;--fg:#e8eaf0;--dim:#8b93a7;--accent:#5b8def;--warn:#d29922;--bad:#f85149}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{flex:0 0 auto;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:16px}
  h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  .counts{color:var(--dim);font-size:13px}

  .split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:2fr 1fr;gap:16px;width:100%;max-width:1500px;margin:0 auto;padding:16px 22px 8px}
  .col{min-height:0;min-width:0;overflow:auto;padding-right:4px}
  .col-head{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:baseline;gap:8px;padding:0 2px 9px;border-bottom:1px solid var(--line)}
  .col-head h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:0;font-weight:600}
  .col-head .n{color:#5f6778;font:11.5px ui-monospace,monospace}
  .col-empty{color:#5f6778;font-size:12.5px;margin:12px 2px}

  .item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;cursor:pointer;transition:border-color .12s}
  .item:hover{border-color:#3a4150}
  .item.sel{border-color:var(--accent);border-left-color:var(--accent)}
  .item.p0{border-left-color:var(--bad)} .item.p1{border-left-color:var(--warn)}
  .item.action{border-left-color:var(--warn)}
  .item.failed{border-left-color:var(--bad)}
  .title{font-weight:550;margin:0 0 3px}
  .meta{color:var(--dim);font-size:12.5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .why{margin:6px 0 0;color:#b9c0d0;font-size:13.5px}
  .ask{margin:8px 0 0;padding:8px 10px;background:#1d2230;border-radius:7px;font-size:13.5px;border-left:2px solid var(--accent)}
  .ask b{color:var(--accent);font-weight:600}
  .opts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .opt{background:#212734;border:1px solid #2e3542;border-radius:999px;padding:5px 12px;font-size:13px;color:#d5dae6;display:flex;gap:7px;align-items:center}
  .opt:hover{border-color:var(--accent);color:#fff}
  .opt kbd{background:#0f1115;border:1px solid #333b4a;border-radius:4px;padding:0 5px;font:11px ui-monospace,monospace;color:var(--accent)}
  .links{display:flex;gap:12px;margin-top:8px;font-size:13px;flex-wrap:wrap}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .shots{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .shots img{height:88px;border-radius:6px;border:1px solid var(--line);object-fit:cover}

  .tag{font-size:10px;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;padding:0 5px;border:1px solid #2e3542;color:#8b93a7;line-height:1.6}
  .tag.decision{color:#8fa6d8;border-color:#2f3a4f}
  .tag.start{color:#7fd3a0;border-color:#274234}
  .tag.action{color:#d8a93a;border-color:#463c22}

  .card-actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .btn{background:#212734;border:1px solid #2e3542;border-radius:7px;padding:6px 12px;font-family:inherit;font-size:13px;color:#d5dae6;cursor:pointer}
  .btn:hover{border-color:#3a4150;color:#fff}
  .btn.primary{background:#2f5fb3;border-color:#4a79c9;color:#fff;font-weight:550}
  .btn.primary:hover{background:#356ad0;color:#fff}
  .btn.start{background:#1f7a45;border-color:#2a9a58;color:#fff;font-weight:550}
  .btn.start:hover{background:#23864c;color:#fff}

  .answer-row{display:flex;gap:8px;margin-top:10px;align-items:center}
  .answer-input{flex:1;background:#0f1115;border:1px solid #333b4a;border-radius:7px;color:var(--fg);padding:8px 11px;font-family:inherit;font-size:13.5px;outline:none}
  .answer-input:focus{border-color:var(--accent)}
  .answer-input::placeholder{color:#6d7585}
  .answer-send{background:var(--accent);border:0;border-radius:7px;color:#fff;padding:8px 14px;font-family:inherit;font-size:13.5px;cursor:pointer}
  .answer-send:hover{filter:brightness(1.1)}

  .act-group{position:sticky;top:34px;z-index:2;background:var(--bg);padding:10px 2px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#5f6778;font-weight:600}
  .act{padding:7px 2px;border-bottom:1px solid #1b2029;font-size:12.5px;color:#98a1b2;min-width:0;overflow-wrap:anywhere;word-break:break-word}
  .act-head{display:flex;flex-wrap:wrap;gap:0 5px;align-items:baseline}
  .act .rel{color:#6f7a8d;font-variant-numeric:tabular-nums;white-space:nowrap}
  .act .sep{color:#39404d}
  .act .who{color:#8b93a7}
  .act-mid{margin-top:1px}
  .act .act-name{color:#a9b2c4}
  .act-txt{color:#7f889b;font-size:12px;margin-top:1px}
  .act a{color:#7e97c9;overflow-wrap:anywhere}

  footer{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 22px;font-size:12px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--dim)}
  kbd{background:#222834;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font:11px ui-monospace,monospace;color:#cfd5e3}

  @media (max-width:1100px){
    body{overflow:auto}
    .split{display:block;overflow:visible;padding-bottom:16px}
    .col{overflow:visible;margin-bottom:22px;padding-right:0}
    .col-head{position:static}
  }
</style>
</head>
<body>
<header>
  <h1>🤖 Agent Queue</h1>
  <span class="counts" id="counts"></span>
  <span style="flex:1"></span>
  <span class="counts" id="updated"></span>
</header>

<main class="split" id="board">
  <section class="col" id="col-waiting">
    <div class="col-head"><h2>Waiting on you</h2><span class="n" id="n-waiting"></span></div>
    <div id="todo"></div>
  </section>
  <section class="col" id="col-activity">
    <div class="col-head"><h2>Activity</h2><span class="n" id="n-activity"></span></div>
    <div id="activity"></div>
  </section>
</main>

<footer>
  <span><kbd>j</kbd><kbd>k</kbd> move</span>
  <span><kbd>1</kbd>-<kbd>4</kbd> pick</span>
  <span><kbd>a</kbd> or click to type</span>
  <span><kbd>x</kbd> no action</span>
  <span><kbd>s</kbd> snooze</span>
  <span><kbd>o</kbd> open</span>
</footer>

<script>
let data = {items:[]}, feed = [], sel = 0, visible = [], drafts = {}, selId = null, acked = null;
let pending = false, reqSeq = 0, source = null, backoff = 1000, pollTimer = null;
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Hold only while a field has focus. Drafts live in memory and are restored
// into the input on every render, so a re-render with a draft loses nothing.
const held = () => document.activeElement.tagName === "INPUT";

function applyHeld(){
  if (pending && !held()) { pending = false; render(); }
}

async function load(force){
  const mine = ++reqSeq;
  let next, act;
  try {
    const [q, a] = await Promise.all([fetch("/queue"), fetch("/activity")]);
    next = await q.json();
    act = a.ok ? await a.json() : {entries:[]};
  } catch (e) { return; }
  if (mine !== reqSeq) return;            // a newer fetch already landed
  data = next;
  feed = (act && Array.isArray(act.entries)) ? act.entries : [];
  if (!force && held()) { pending = true; return; }
  pending = false;
  render();
}

function startPolling(){ if (!pollTimer) pollTimer = setInterval(() => load(), 30000); }
function stopPolling(){ if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// Live updates. If the stream won't hold, fall back to polling and retry.
// `gen` keeps a stale connection from re-arming or replacing the live one.
let gen = 0;
function connect(){
  if (typeof EventSource === "undefined") { startPolling(); return; }
  const mine = ++gen;
  if (source) { source.close(); source = null; }
  const es = new EventSource("/events");
  source = es;
  es.addEventListener("open", () => {
    if (mine !== gen) return;
    backoff = 1000;
    stopPolling();
    load();
  });
  es.addEventListener("changed", () => { if (mine === gen) load(); });
  es.addEventListener("error", () => {
    if (mine !== gen) return;
    es.close();
    if (source === es) source = null;
    startPolling();
    setTimeout(() => { if (mine === gen) connect(); }, backoff);
    backoff = Math.min(backoff * 2, 30000);
  });
}

// ---- relative time, because "12m ago" reads and "14:41" doesn't ----
function parseAt(at){
  if (!at) return null;
  const hasTime = /\d{2}:\d{2}$/.test(at);
  const d = new Date(at.replace(" ", "T") + (hasTime ? "" : "T00:00:00"));
  return isNaN(d.getTime()) ? null : d;
}
function dayDiff(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const day = new Date(d); day.setHours(0,0,0,0);
  return Math.round((today - day) / 86400000);
}
function shortDate(d){
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}
function relTime(at){
  const d = parseAt(at);
  if (!d) return "";
  if (!/\d{2}:\d{2}/.test(at)){
    // no clock on this line: say so plainly rather than implying a time
    return dayDiff(d) === 0 ? "today" : shortDate(d);
  }
  const secs = (Date.now() - d.getTime()) / 1000;
  if (secs < 60) return "just now";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  const mins = Math.floor(secs / 60);
  if (secs < 7200){                 // just past the hour keeps its minutes
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? h + "h " + m + "m ago" : h + "h ago";
  }
  if (secs < 86400) return Math.floor(secs / 3600) + "h ago";
  // "yesterday" means the calendar day, not just "less than 48h ago"
  if (secs < 172800 && dayDiff(d) === 1) return "yesterday";
  return shortDate(d);
}
function bucket(e){
  const d = parseAt(e.at);
  if (!d) return "Earlier";
  const diff = dayDiff(d);
  return diff <= 0 ? "Today" : diff === 1 ? "Yesterday" : "Earlier";
}

// Title badge: how many cards showed up since he last looked at the top of the
// list with the tab in front. Nothing else fires.
function updateBadge(todo){
  const col = document.getElementById("col-waiting");
  const watching = document.hasFocus() && col && col.scrollTop === 0;
  if (acked === null || watching) acked = new Set(todo.map(i => i.id));
  const fresh = todo.reduce((n, i) => n + (acked.has(i.id) ? 0 : 1), 0);
  document.title = fresh ? "(" + fresh + ") Agent Queue" : "Agent Queue";
}

function maybeAcknowledge(){
  const col = document.getElementById("col-waiting");
  if (document.hasFocus() && col && col.scrollTop === 0){
    acked = new Set(visible.map(i => i.id));
    document.title = "Agent Queue";
  }
}

addEventListener("focus", maybeAcknowledge);
addEventListener("scroll", maybeAcknowledge, true);
document.addEventListener("visibilitychange", maybeAcknowledge);

// agents may hand-write a notify kind; render it as the kind it means
const KIND_MAP = {done: "action", failed: "action", blocked: "decision", scope: "decision", info: "action"};
const cardKind = it => {
  const k = it.kind || "decision";
  return ["action", "decision", "start"].includes(k) ? k : (KIND_MAP[k] || "decision");
};

function render(){
  const items = data.items || [];
  const todo = items.filter(i => i.status === "open")
                    .sort((a,b) => (a.priority ?? 3) - (b.priority ?? 3)
                                 || (data.areas?.[a.area]?.order ?? 99) - (data.areas?.[b.area]?.order ?? 99));

  visible = todo;
  // Follow the item, not the index. If it's gone, stay at its slot.
  if (selId){
    const at = visible.findIndex(i => i.id === selId);
    if (at >= 0) sel = at;
  }
  sel = Math.min(sel, Math.max(0, visible.length - 1));
  selId = visible[sel]?.id ?? null;

  updateBadge(todo);
  document.getElementById("counts").textContent = todo.length ? todo.length + " waiting" : "nothing waiting on you";
  document.getElementById("updated").textContent = data.updated ? "updated " + relTime(data.updated) : "";
  document.getElementById("n-waiting").textContent = todo.length;
  document.getElementById("n-activity").textContent = feed.length;

  const cols = ["col-waiting","col-activity"].map(id => document.getElementById(id));
  const tops = cols.map(c => c.scrollTop);

  document.getElementById("todo").innerHTML = todo.map(it => {
    const n = visible.indexOf(it);
    const kind = cardKind(it);
    const failed = it.kind === "failed" || (it.notice && it.notice.kind === "failed");
    const cls = ["item", kind === "decision" ? "p" + (it.priority ?? 3) : kind, failed ? "failed" : ""].join(" ").trim();
    const shots = (it.screenshots||[]).map(s => `<img src="${esc(s)}" alt="">`).join("");
    const links = (it.links||[]).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.label)}</a>`).join("");
    const opts = (it.options||[]).map((o,i) =>
      `<span class="opt" data-opt="${i}"><kbd>${i+1}</kbd>${esc(o)}</span>`).join("");
    const acts = kind === "start"
      ? `<div class="card-actions">
           <button class="btn start" data-act="start">Start</button>
           <button class="btn" data-act="notnow">Not now</button>
           <button class="btn" data-act="scope">Change scope</button>
         </div>`
      : kind === "action"
      ? `<div class="card-actions">
           <button class="btn primary" data-act="done">Done</button>
           <button class="btn" data-act="snooze">Snooze</button>
         </div>`
      : "";
    const answer = n === sel
      ? `<div class="answer-row">
           <input class="answer-input" data-id="${esc(it.id)}" value="${esc(drafts[it.id]||"")}"
                  placeholder="My call on this one...">
           <button class="answer-send">Record</button>
         </div>`
      : "";
    return `<article class="${cls}" data-i="${n}" data-id="${esc(it.id)}">
      <p class="title">${esc(it.title)}</p>
      <div class="meta"><span class="tag ${kind}">${kind}</span><span>${esc(it.area||"")}</span>${it.source?`<span>${esc(it.source)}</span>`:""}${(it.since||it.createdAt)?`<span data-at="${esc(it.since||it.createdAt)}">${esc(relTime(it.since||it.createdAt))}</span>`:""}</div>
      ${it.why?`<p class="why">${esc(it.why)}</p>`:""}
      ${it.ask?`<p class="ask"><b>My call:</b> ${esc(it.ask)}</p>`:""}
      ${opts?`<div class="opts">${opts}</div>`:""}
      ${acts}
      ${shots?`<div class="shots">${shots}</div>`:""}
      ${links?`<div class="links">${links}</div>`:""}
      ${answer}
    </article>`;
  }).join("") || `<p class="col-empty">Nothing waiting on you.</p>`;

  renderFeed();
  cols.forEach((c,i) => { if (c.scrollTop !== tops[i]) c.scrollTop = tops[i]; });
  wire();
}

function actLine(e, i){
  const head = [`<span class="rel" data-at="${esc(e.at || "")}" title="${esc(e.at || "")}">${esc(relTime(e.at))}</span>`];
  if (e.who) head.push(`<span class="who">${esc(e.who)}</span>`);

  let mid = "";
  if (e.action){
    const label = e.target
      ? (e.url && /^https?:\/\//i.test(e.url)
          ? ` <a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.target)}</a>`
          : " " + esc(e.target))
      : "";
    mid = `<div class="act-mid"><span class="act-name">${esc(e.action)}${label}</span></div>`;
  }
  const txt = e.text ? `<div class="act-txt">${esc(e.text)}</div>` : "";
  return `<div class="act"><div class="act-head">${head.join(`<span class="sep"> · </span>`)}</div>${mid}${txt}</div>`;
}

function renderFeed(){
  const groups = [["Today", []], ["Yesterday", []], ["Earlier", []]];
  const idx = {"Today":0, "Yesterday":1, "Earlier":2};
  feed.forEach((e, i) => groups[idx[bucket(e)]][1].push([e, i]));
  document.getElementById("activity").innerHTML = groups.filter(g => g[1].length).map(([name, list]) =>
    `<div class="act-group">${name}</div>` + list.map(([e, i]) => actLine(e, i)).join("")
  ).join("") || `<p class="col-empty">No activity yet.</p>`;
}

// every relative label on the page, refreshed from its own timestamp
setInterval(() => {
  document.querySelectorAll("[data-at]").forEach(el => {
    el.textContent = relTime(el.dataset.at);
  });
}, 15000);

function wire(){
  const el = document.querySelector(`#todo .item[data-i="${sel}"]`);
  if (!el) return;
  el.classList.add("sel");
  const input = el.querySelector(".answer-input");
  if (input){
    input.addEventListener("input", () => { drafts[input.dataset.id] = input.value; });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { submit(input); e.stopPropagation(); }
      if (e.key === "Escape") { drafts[input.dataset.id] = ""; input.value = ""; input.blur(); }
    });
    el.querySelector(".answer-send").addEventListener("click", e => { e.stopPropagation(); submit(input); });
  }
}

function submit(input){
  const text = input.value.trim();
  if (!text) return;
  drafts[input.dataset.id] = "";
  decide(input.dataset.id, text);
}

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) console.error(path, r.status);
  await load(true);
}

// id comes from the card/input, so a refresh that reorders the list can't
// land a decision on a different item.
async function decide(id, choice){
  const it = (data.items || []).find(i => i.id === id);
  if (!it || typeof choice !== "string" || !choice) return;
  await post("/decide", {id, choice});
}

// "Change scope" opens the same input the decisions use, pre-filled.
function changeScope(id){
  selId = id;
  render();
  const input = document.querySelector(`#todo .item[data-id="${CSS.escape(id)}"] .answer-input`);
  if (!input) return;
  if (!input.value.trim()){
    input.value = "Change scope: ";
    drafts[id] = input.value;
  }
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

document.getElementById("board").addEventListener("click", e => {
  if (e.target.closest("a") || e.target.closest(".answer-row")) return;
  const card = e.target.closest(".item"); if (!card) return;
  const n = +card.dataset.i;
  const it = (data.items || []).find(i => i.id === card.dataset.id);
  const btn = e.target.closest(".btn");
  if (btn) {
    e.stopPropagation();
    if (!it) return;
    sel = n; selId = it.id;
    if (btn.dataset.act === "start") post("/start", {id: it.id});
    else if (btn.dataset.act === "notnow" || btn.dataset.act === "snooze") post("/snooze", {id: it.id});
    else if (btn.dataset.act === "done") post("/resolve", {id: it.id});
    else if (btn.dataset.act === "scope") changeScope(it.id);
    return;
  }
  const opt = e.target.closest(".opt");
  if (opt) {
    sel = n; selId = visible[n]?.id ?? null;
    if (it) decide(it.id, (it.options||[])[+opt.dataset.opt]);
    return;
  }
  if (n !== sel) { sel = n; selId = visible[n]?.id ?? null; render(); }
  const input = document.querySelector(`#todo .item[data-i="${sel}"] .answer-input`);
  if (input) input.focus();
});

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key;
  const it = visible[sel];
  if (k === "j" || k === "ArrowDown") { sel = Math.min(sel+1, visible.length-1); selId = visible[sel]?.id ?? null; render(); e.preventDefault(); }
  else if (k === "k" || k === "ArrowUp") { sel = Math.max(sel-1, 0); selId = visible[sel]?.id ?? null; render(); e.preventDefault(); }
  else if (/^[1-4]$/.test(k)) { const c = (it?.options||[])[+k-1]; if (it && c !== undefined) decide(it.id, c); }
  else if (k === "a") { const i = document.querySelector(`#todo .item[data-i="${sel}"] .answer-input`); if (i) { i.focus(); i.select(); e.preventDefault(); } }
  else if (k === "x") { if (it) post("/resolve", {id: it.id}); }
  else if (k === "s") { if (it) post("/snooze", {id: it.id}); }
  else if (k === "o") { const l = it?.links?.[0]; if (l) window.open(l.url, "_blank"); }
});

document.addEventListener("focusout", () => setTimeout(applyHeld, 0));
document.addEventListener("input", e => { if (e.target.classList?.contains("answer-input") && !e.target.value.trim()) applyHeld(); }, true);
setInterval(applyHeld, 1000);

load();
connect();
</script>
</body>
